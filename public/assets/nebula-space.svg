<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1024" viewBox="0 0 2048 1024">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02030b"/>
      <stop offset=".48" stop-color="#07091b"/>
      <stop offset="1" stop-color="#03030c"/>
    </linearGradient>
    <radialGradient id="violet" cx=".28" cy=".38" r=".7">
      <stop offset="0" stop-color="#56316f" stop-opacity=".78"/>
      <stop offset=".38" stop-color="#2b1d55" stop-opacity=".45"/>
      <stop offset=".76" stop-color="#0d122d" stop-opacity=".12"/>
      <stop offset="1" stop-color="#03040c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magenta" cx=".74" cy=".46" r=".65">
      <stop offset="0" stop-color="#6b294f" stop-opacity=".55"/>
      <stop offset=".42" stop-color="#3d2052" stop-opacity=".34"/>
      <stop offset=".82" stop-color="#090c22" stop-opacity=".06"/>
      <stop offset="1" stop-color="#02030b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx=".5" cy=".58" r=".72">
      <stop offset="0" stop-color="#173a68" stop-opacity=".46"/>
      <stop offset=".44" stop-color="#142551" stop-opacity=".27"/>
      <stop offset=".83" stop-color="#050817" stop-opacity=".05"/>
      <stop offset="1" stop-color="#02030b" stop-opacity="0"/>
    </radialGradient>
    <filter id="warp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".0025 .0065" numOctaves="4" seed="87" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="150" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="wisps" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .018" numOctaves="3" seed="21" result="n"/>
      <feColorMatrix in="n" type="matrix" values="
        .7 0 0 0 .02
        0 .55 0 0 .02
        0 0 .95 0 .08
        0 0 0 .38 0" result="colored"/>
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect width="2048" height="1024" fill="url(#space)"/>
  <g filter="url(#warp)">
    <ellipse cx="520" cy="390" rx="700" ry="330" fill="url(#violet)"/>
    <ellipse cx="1540" cy="470" rx="760" ry="360" fill="url(#magenta)"/>
    <ellipse cx="1040" cy="650" rx="900" ry="300" fill="url(#blue)"/>
  </g>
  <rect width="2048" height="1024" filter="url(#wisps)" opacity=".58"/>
  <g opacity=".26" fill="#8da7ff">
    <circle cx="240" cy="220" r="1.4"/><circle cx="430" cy="780" r="1.1"/>
    <circle cx="870" cy="310" r="1.2"/><circle cx="1210" cy="190" r="1.1"/>
    <circle cx="1490" cy="720" r="1.3"/><circle cx="1770" cy="350" r="1.2"/>
  </g>
</svg>